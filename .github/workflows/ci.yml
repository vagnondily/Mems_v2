name: intégration continue

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Dépendances du serveur
        working-directory: server
        run: npm ci

      - name: Tests de l'API
        working-directory: server
        env:
          JWT_SECRET: ${{ '0123456789abcdef0123456789abcdef0123456789abcdef' }}
          DATA_KEY:   ${{ 'fedcba9876543210fedcba9876543210fedcba9876543210' }}
        run: npm test

      - name: Dépendances du frontend
        working-directory: web
        run: npm ci

      - name: Compilation du frontend
        working-directory: web
        run: npm run build

      - name: Tests de bout en bout
        working-directory: web
        run: npm test

      - name: Audit des dépendances
        run: |
          cd server && npm audit --audit-level=high || true
          cd ../web && npm audit --audit-level=high || true
