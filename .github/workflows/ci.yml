name: intégration continue

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mems
          POSTGRES_PASSWORD: mems_ci_pw
          POSTGRES_DB: mems_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mems -d mems_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Dépendances du serveur
        working-directory: server
        run: npm ci

      - name: Tests de l'API
        working-directory: server
        env:
          JWT_SECRET: ${{ '0123456789abcdef0123456789abcdef0123456789abcdef' }}
          DATA_KEY:   ${{ 'fedcba9876543210fedcba9876543210fedcba9876543210' }}
          DATABASE_URL: postgres://mems:mems_ci_pw@127.0.0.1:5432/mems_test
        run: npm test

      - name: Dépendances du frontend
        working-directory: web
        run: npm ci

      - name: Compilation du frontend
        working-directory: web
        run: npm run build

      - name: Tests de bout en bout
        working-directory: web
        run: npm test

      # Le « || true » qui terminait ces deux lignes rendait l'étape verte quelle
      # que soit la vulnérabilité trouvée. C'est ce qui a laissé passer xlsx
      # pendant des mois. L'étape échoue désormais pour de bon.
      #
      # Côté web on n'audite que les dépendances de production : les avis qui
      # visent le serveur de développement de Vite ne concernent pas ce qui est
      # livré, et les faire échouer la CI ferait revenir le « || true ».
      #
      # Côté serveur, les 9 avis « high » de la chaîne exceljs sont inatteignables
      # (l'API non-streaming passe par JSZip, jamais par archiver) et il n'existe
      # aucun correctif amont — exceljs 4.4.0 est la dernière version publiée.
      # Ils sont donc exclus nommément, avec leur justification, plutôt que noyés
      # sous un « || true ». À réexaminer si exceljs publie de nouveau.
      - name: Audit des dépendances du serveur
        run: node scripts/audit.mjs server --omit-dev

      - name: Audit des dépendances du frontend
        run: node scripts/audit.mjs web --omit-dev
