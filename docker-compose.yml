services:
  postgres:
    image: postgres:16-alpine
    container_name: mems-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mems
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: mems
    volumes:
      - mems-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mems -d mems"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  mems:
    build: .
    image: mems:1.0.0
    container_name: mems
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://mems:${POSTGRES_PASSWORD}@postgres:5432/mems
      TRUST_PROXY: "1"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"     # exposé en local ; publiez via un reverse proxy TLS
    volumes:
      - mems-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

volumes:
  mems-postgres-data:
  mems-data:
